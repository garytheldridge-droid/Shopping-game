<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Shopping Game V4</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
<header class="top"><div class="toprow"><div class="brand">SHOPPING GAME <span style="color:#999">V4</span></div><div class="right"><button class="circle" onclick="showNotifications()">🔔</button><div class="balance" id="balance">£0.00</div></div></div></header>

<main>
<section id="home" class="view active">
<div class="hero"><small id="chequeLabel">WELCOME CHEQUE</small><h1 id="chequeAmount">£2,500</h1><p id="chequeCopy">Your first shopping fund.</p><button class="primary" id="chequeBtn" onclick="collectCheque()">OPEN CHEQUE</button></div>
<div class="search"><span class="mag">⌕</span><input placeholder="Search anything… pink, gaming, cheap…" oninput="searchHome(this.value)"><button class="clear">→</button></div>
<div class="section"><div class="sectionhead"><h2>🔥 Trending now</h2><button class="link" onclick="openShop()">See all</button></div><div id="homeFeed" class="feed"></div></div>
<div class="section"><div class="sectionhead"><h2>🎯 Today's quests</h2><button class="link" onclick="openShop()">Shop</button></div><div id="quests"></div></div>
</section>

<section id="shop" class="view">
<div class="head"><h1>Shop</h1><span class="count" id="shopCount">0 items</span></div>
<div class="search"><span class="mag">⌕</span><input id="shopSearch" placeholder="Search the catalogue…" oninput="visibleCount=PAGE_SIZE;renderShop()"><button class="clear" onclick="document.getElementById('shopSearch').value='';visibleCount=PAGE_SIZE;renderShop()">×</button></div>
<div class="chips" id="chips"></div>
<div id="shopFeed" class="feed"></div>
<div class="loader" id="loader">Keep scrolling…</div><div class="sentinel" id="sentinel"></div>
</section>

<section id="basket" class="view"><div class="head"><h1>Your basket 🛒</h1></div><div id="basketList"></div><div id="basketTotal"></div></section>

<section id="orders" class="view"><div class="head"><h1>Orders 📦</h1></div><div id="orderList"></div></section>

<section id="me" class="view">
<div class="profile"><div class="muted" style="font-weight:900">SHOPPING FORTUNE</div><div class="big" id="profileBalance">£0</div><div class="muted">Virtual money. Very real shopping feelings.</div>
<div class="stats"><div class="stat"><b id="spent">£0</b><span>spent</span></div><div class="stat"><b id="owned">0</b><span>items owned</span></div><div class="stat"><b id="questCash">£0</b><span>quest cash</span></div><div class="stat"><b id="orderCount">0</b><span>orders</span></div></div></div>
<div class="section"><div class="sectionhead"><h2>🎒 My bag</h2></div><div id="ownedList"></div></div>
<div class="section"><button class="chip" onclick="showNotifications()">🔔 Notifications</button> <button class="chip" onclick="resetDemo()">Reset demo</button></div>
</section>
</main>

<div class="bottom"><div class="nav">
<button class="active" onclick="nav('home',this)"><span class="ico">🏠</span>Home</button>
<button onclick="nav('shop',this)"><span class="ico">🛍️</span>Shop</button>
<button onclick="nav('basket',this)"><span class="ico">🛒</span>Basket <span id="navBasket"></span></button>
<button onclick="nav('orders',this)"><span class="ico">📦</span>Orders</button>
<button onclick="nav('me',this)"><span class="ico">👤</span>Me</button>
</div></div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast"></div>
</div>
<script src="fallback-catalog.js"></script>
<script src="app.js"></script>
</body>
</html>
